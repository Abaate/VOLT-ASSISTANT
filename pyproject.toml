[project]
name = "volt-assistant"
version = "0.1.0"
description = "Local personal AI agent with CLI, FastAPI server, tools, memory, and Android client"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic-settings>=2.6", "rich>=13.9", "typer>=0.12", "websockets>=13.0"]

[project.scripts]
volt = "volt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
